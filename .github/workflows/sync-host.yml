name: Sync website pages to host repository

on:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - ".github/workflows/sync-host.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source website
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout hosting repository
        uses: actions/checkout@v4
        with:
          repository: NotY215/Web-host
          token: ${{ secrets.WEB_HOST_TOKEN }}
          path: host

      - name: Copy source pages to hosting layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p host/NotYvos
          cp source/index.html host/NotYvos/index.html
          cp source/about.html host/NotYvos/About.html
          cp source/architecture.html host/NotYvos/Architecture.html
          cp source/documentation.html host/NotYvos/Documentation.html
          cp source/roadmap.html host/NotYvos/Roadmap.html
          cp source/updates.html host/NotYvos/Updates.html
          cp source/faq.html host/NotYvos/FAQ.html
          cp source/developer.html host/NotYvos/Developer.html
          cp source/ppsx3.html host/NotYvos/ppsx3.html
          for page in host/NotYvos/index.html host/NotYvos/About.html host/NotYvos/Architecture.html host/NotYvos/Documentation.html host/NotYvos/Roadmap.html host/NotYvos/Updates.html host/NotYvos/FAQ.html host/NotYvos/Developer.html host/NotYvos/ppsx3.html; do
            sed -i 's#href="/assets/css/#href="https://cdn.jsdelivr.net/gh/NotY215/NotYVOS-Web@main/assets/css/#g' "$page"
            sed -i 's#src="/assets/js/#src="https://cdn.jsdelivr.net/gh/NotY215/NotYVOS-Web@main/assets/js/#g' "$page"
          done

      - name: Commit and push changes
        working-directory: host
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotYvos/index.html NotYvos/About.html NotYvos/Architecture.html NotYvos/Documentation.html NotYvos/Roadmap.html NotYvos/Updates.html NotYvos/FAQ.html NotYvos/Developer.html NotYvos/ppsx3.html
          if git diff --cached --quiet; then
            echo "No hosting page changes to sync."
            exit 0
          fi
          git commit -m "Sync website pages from NotYVOS-Web"
          git push
